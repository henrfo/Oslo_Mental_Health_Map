name: Weekly checks

# Every Monday: check each entry's website (writes _data/health.yml for the
# "Brutt lenke" tag) and compare each `kilde` page with last week's copy
# (opens an issue when it changed). Entries are never edited automatically.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml==6.0.2

      - name: Link check
        run: python scripts/weekly_checks.py links

      - name: Source check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create kilde-endring --color FBCA04 --description "A source page changed; check the entry" 2>/dev/null || true
          python scripts/weekly_checks.py sources --issues

      - name: Commit link status and source snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/health.yml _snapshots
          git diff --cached --quiet || { git commit -m "Weekly link status and source snapshots"; git push; }
