<!DOCTYPE html>
<html lang="{% if page.bilingual %}nb{% else %}en{% endif %}"{% if page.bilingual %} data-lang="nb"{% endif %}>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title{% if page.title_nb %} data-nb="{{ page.title_nb }}" data-en="{{ page.title }}"{% endif %}>{{ page.title | default: site.title }}</title>
  {%- if page.bilingual %}
  <script>
    // Pick the language before first paint: ?lang= wins, then the saved choice, else Norwegian
    (function() {
      let lang = new URLSearchParams(location.search).get('lang');
      if (!lang) { try { lang = localStorage.getItem('omhm-lang'); } catch (e) {} }
      lang = lang === 'en' ? 'en' : 'nb';
      document.documentElement.dataset.lang = lang;
      document.documentElement.lang = lang;
      // Tab title in the chosen language (the <title> tag comes before this script)
      const title = document.querySelector('title');
      if (title && title.dataset[lang]) document.title = title.dataset[lang];
    })();
  </script>
  {%- endif %}
  <meta name="description" content="{{ site.description }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {{ content }}
</body>
</html>
